<!doctype html>
<html class="no-js" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gráfico de Barras Horizontal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
    <link rel="stylesheet" href="./style/index.css">
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Graficación</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link text-white" href="index.html">Ejercicio 1</a>
        </div>
      </div>
    </nav>

    <div class="container mt-3">
      <div class="card">
        <div class="card-header text-center">
          Gráfico de Barras Horizontal
        </div>
        <div class="card-body">
          <div class="row">

            <!-- Formulario de datos -->
            <div class="col-md-4">
              <h6 class="mb-2">Datos</h6>
              <table class="table table-sm table-bordered">
                <thead class="table-light">
                  <tr>
                    <th>Etiqueta</th>
                    <th>Valor</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="tablaBody"></tbody>
              </table>
              <button id="btnAgregar"  class="btn btn-sm btn-outline-secondary w-100 mb-2">+ Agregar fila</button>
              <button id="btnGraficar" class="btn btn-primary w-100">▶ Graficar</button>
            </div>

            <!-- Canvas -->
            <div class="col-md-8 text-center">
              <canvas id="barCanvas" width="600" height="400" class="border"></canvas>
            </div>

          </div>
        </div>
        <div class="card-footer text-muted text-center">
          Graficación — TypeScript + Canvas API
        </div>
      </div>
    </div>

    <footer id="footer" class="pb-4 pt-4 mt-4">
      <div class="container text-center">
        <a href="https://github.com/GerardoMHDZ07/graphics">Repositorio</a>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0" crossorigin="anonymous">
    </script>
    <script src="./dist/src/barChartIndex.js" type="module"></script>
  </body>
</html>
