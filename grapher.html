<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graficador de Funciones</title>
  <link rel="stylesheet" href="./style/grapher.css">
</head>
<body>
  <div class="app">

    <!-- Panel lateral de controles -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo">f(x)</span>
        <h1>Graficador</h1>
        <p class="subtitle">Graficación – TypeScript</p>
      </div>

      <!-- Entrada de función -->
      <section class="control-group">
        <label class="control-label" for="funcInput">Función</label>
        <div class="input-row">
          <span class="input-prefix">f(x) =</span>
          <input id="funcInput" type="text" class="func-input"
                 value="sin(x)" placeholder="Ej: sin(x), x*x" autocomplete="off" spellcheck="false">
        </div>
        <div id="errorMsg" class="error-msg" style="display:none">
          ⚠ Expresión inválida. Usa sintaxis JS: <code>sin(x)</code>, <code>x*x</code>
        </div>
      </section>

      <!-- Color de la función -->
      <section class="control-group">
        <label class="control-label" for="funcColor">Color</label>
        <div class="color-row">
          <input id="funcColor" type="color" value="#f87171" class="color-picker">
          <span class="color-hint">Color de la curva</span>
        </div>
      </section>

      <!-- Funciones predefinidas -->
      <section class="control-group">
        <label class="control-label" for="presets">Presets</label>
        <select id="presets" class="preset-select">
          <option value="">— Seleccionar función —</option>
          <optgroup label="Trigonométricas">
            <option value="sin(x)">sin(x)</option>
            <option value="cos(x)">cos(x)</option>
            <option value="tan(x)">tan(x)</option>
            <option value="sin(x) + cos(2*x)">sin(x) + cos(2x)</option>
          </optgroup>
          <optgroup label="Polinomiales">
            <option value="x">x (lineal)</option>
            <option value="x*x">x²</option>
            <option value="x*x*x">x³</option>
            <option value="x*x - 2">x² - 2</option>
            <option value="x*x*x - 3*x">x³ - 3x</option>
          </optgroup>
          <optgroup label="Otras">
            <option value="sqrt(abs(x))">√|x|</option>
            <option value="log(abs(x))">ln|x|</option>
            <option value="1/x">1/x</option>
            <option value="exp(-x*x)">e^(-x²)</option>
            <option value="sin(x)/x">sin(x)/x</option>
          </optgroup>
        </select>
      </section>

      <!-- Botón principal -->
      <button id="btnPlot" class="btn btn-primary">▶ Graficar</button>

      <!-- Controles de zoom -->
      <section class="control-group">
        <label class="control-label">Zoom</label>
        <div class="zoom-row">
          <button id="btnZoomIn"  class="btn btn-zoom" title="Acercar">+</button>
          <span id="zoomLabel" class="zoom-label">1.00x</span>
          <button id="btnZoomOut" class="btn btn-zoom" title="Alejar">−</button>
        </div>
        <button id="btnReset" class="btn btn-secondary">↺ Restablecer vista</button>
        <p class="hint">También puedes usar la rueda del mouse sobre el canvas.</p>
      </section>

      <!-- Referencia -->
      <section class="control-group reference">
        <label class="control-label">Referencia</label>
        <code class="ref-code">sin cos tan sqrt log exp abs pow PI E</code>
        <p class="hint">Usa estas funciones directamente sin prefijo <em>Math.</em></p>
      </section>

      <div class="sidebar-footer">
        <a href="index.html">← Ejercicio 1</a>
        <a href="https://github.com/GerardoMHDZ07/graphics" target="_blank">GitHub ↗</a>
      </div>
    </aside>

    <!-- Canvas principal -->
    <main class="canvas-area">
      <canvas id="graphCanvas" width="820" height="580"></canvas>
    </main>

  </div>

  <script src="./dist/src/grapherIndex.js" type="module"></script>
</body>
</html>
