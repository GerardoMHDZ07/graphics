<!doctype html>
<html class="no-js" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graficador de Funciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">
    <link rel="stylesheet" href="./style/index.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Graficación</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link text-white" href="index.html">Ejercicio 1</a>
        </div>
      </div>
    </nav>

    <div class="card text-center mt-3 mx-auto" style="max-width: 700px;">
      <div class="card-header">
        Graficador de Funciones
      </div>

      <div class="card-body">
        <!-- Selección de función -->
        <p class="mb-2"><strong>Selecciona una función:</strong></p>
        <div class="btn-group mb-3" role="group">
          <button id="btnSin"  class="btn btn-outline-primary">sin(x)</button>
          <button id="btnCos"  class="btn btn-outline-primary">cos(x)</button>
          <button id="btnLin"  class="btn btn-outline-primary">x</button>
          <button id="btnCuad" class="btn btn-outline-primary">x²</button>
          <button id="btnCub"  class="btn btn-outline-primary">x³</button>
        </div>

        <!-- Canvas -->
        <canvas id="graphCanvas" width="640" height="480" class="border"></canvas>

        <!-- Zoom -->
        <div class="mt-3">
          <strong>Zoom:</strong>
          <button id="btnZoomIn"  class="btn btn-sm btn-secondary ms-2">+ Acercar</button>
          <button id="btnZoomOut" class="btn btn-sm btn-secondary ms-1">− Alejar</button>
          <button id="btnReset"   class="btn btn-sm btn-outline-secondary ms-1">Restablecer</button>
        </div>
      </div>

      <div class="card-footer text-muted">
        Graficación — TypeScript + Canvas API
      </div>
    </div>

    <footer id="footer" class="pb-4 pt-4 mt-4">
      <div class="container">
        <div class="row text-center">
          <div class="col">
            <a href="https://github.com/GerardoMHDZ07/graphics">Repositorio</a>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0" crossorigin="anonymous">
    </script>
    <script src="./dist/src/grapherIndex.js" type="module"></script>
  </body>
</html>
